# ai-service/pytest.ini
[pytest]
# Configuração do Pytest

# Diretório onde estão os testes
testpaths = tests

# Padrão de nomes de arquivos de teste
python_files = test_*.py

# Padrão de nomes de classes de teste
python_classes = Test*

# Padrão de nomes de funções de teste
python_functions = test_*

# Opções de saída
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Marcadores customizados
markers =
    slow: testes que demoram mais de 5 segundos
    integration: testes de integração (requerem banco de dados ou APIs externas)
    unit: testes unitários (não requerem dependências externas)

# Configuração de cobertura (opcional)
[coverage:run]
source = services, routers, utils
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

