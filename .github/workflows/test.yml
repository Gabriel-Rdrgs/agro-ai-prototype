# .github/workflows/test.yml
# ============================================
# ✅ CI/CD Pipeline - Testes Automatizados
# ============================================

name: Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Permite execução manual

jobs:
  backend-test:
    name: Backend Tests (Jest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # ✅ Atualizado para Node 20 (Supabase requer >=20.0.0)
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check Prisma schema
        working-directory: ./backend
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}

      - name: Run Jest tests
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret
          PYTHON_API_URL: http://localhost:8000
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Generate coverage report
        working-directory: ./backend
        run: npm run test:coverage || echo "⚠️ Coverage report não gerado"
        continue-on-error: true

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # ✅ Atualizado para Node 20 (Supabase requer >=20.0.0)
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          # Tenta npm ci primeiro, se falhar atualiza o lock file
          npm ci || (echo "⚠️ package-lock.json desatualizado, atualizando..." && npm install && npm ci)

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint || echo "⚠️ Lint warnings encontrados"
        continue-on-error: true

      - name: Build (test)
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || 'https://test.supabase.co' }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY || 'test-key' }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'http://localhost:3001' }}

  python-test:
    name: Python Tests (Pytest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest tests
        working-directory: ./ai-service
        run: |
          pytest tests/ -v --tb=short
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_URL: postgresql://test:test@localhost:5432/test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-key' }}

      - name: Generate coverage report
        working-directory: ./ai-service
        run: |
          pytest tests/ --cov=services --cov-report=html --cov-report=term-missing || echo "⚠️ Coverage report não gerado"
        continue-on-error: true
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_URL: postgresql://test:test@localhost:5432/test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-key' }}

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: ai-service/htmlcov/
          retention-days: 7

      - name: Check imports
        working-directory: ./ai-service
        run: |
          python -c "import fastapi; import uvicorn; print('✅ Dependências principais OK')"
        continue-on-error: true

  python-check:
    name: Python Service Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports
        working-directory: ./ai-service
        run: |
          python -c "import fastapi; import uvicorn; print('✅ Dependências principais OK')"
        continue-on-error: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-test, python-test, frontend-test]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
        continue-on-error: true

      - name: Download python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: ai-service/htmlcov/
        continue-on-error: true

      - name: Test Results Summary
        run: |
          echo "## 🧪 Resumo dos Testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend (Jest)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.backend-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Total: 41 testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Python (Pytest)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.python-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Total: 15 testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend (Build)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.frontend-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total de Testes: 56**" >> $GITHUB_STEP_SUMMARY
