version: '3.8'

services:
  # Serviço de IA (Python)
  ai-service:
    build: ./ai-service
    container_name: agro_brain
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - PORT=8000
    volumes:
      - ./ai-service:/app
    restart: always

  # Serviço Backend (Node)
  backend:
    build: ./backend
    container_name: agro_backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - PYTHON_API_URL=http://ai-service:8000
    # O Pulo do Gato: Volumes para atualização em tempo real
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - ai-service
    restart: always
    # Comando para iniciar em modo dev (garanta que seu package.json tem esse script)
    # Se não tiver, use: command: npm start
    command: npm start