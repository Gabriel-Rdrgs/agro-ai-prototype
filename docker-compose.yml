services:
  # Serviço de IA (Python)
  ai-service:
    build: ./ai-service
    container_name: agro_brain
    ports:
      - "8000:8000"
    # Força o carregamento do .env
    env_file:
      - ./ai-service/.env
    environment:
      # Garante que o Python veja o Supabase e não o SQLite
      - DATABASE_URL=${DATABASE_URL} 
      - DIRECT_URL=${DIRECT_URL}
      - PORT=8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./ai-service:/app
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Serviço Backend (Node)
  backend:
    build: ./backend
    container_name: agro_backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
    - PORT=3001
    - DATABASE_URL=${DATABASE_URL}
    - DIRECT_URL=${DIRECT_URL}
    - PYTHON_API_URL=http://ai-service:8000
    - JWT_SECRET=${JWT_SECRET}
    - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - ai-service
      - redis
    command: npm run dev

  # ✅ FASE B - B2: Redis para fila de alertas e cache
  redis:
    image: redis:7-alpine
    container_name: agro_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data: