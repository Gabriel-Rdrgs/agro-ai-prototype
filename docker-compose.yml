version: '3.8'

services:
  # Serviço de IA (Python)
  ai-service:
    build: ./ai-service
    container_name: agro_brain
    ports:
      - "8000:8000"
    # Força o carregamento do .env
    env_file:
      - ./ai-service/.env
    environment:
      # Garante que o Python veja o Supabase e não o SQLite
      - DATABASE_URL=${DATABASE_URL} 
      - DIRECT_URL=${DIRECT_URL}
      - PORT=8000
    volumes:
      - ./ai-service:/app
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Serviço Backend (Node)
  backend:
    build: ./backend
    container_name: agro_backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
    - PORT=3001
    - DATABASE_URL=${DATABASE_URL}
    - DIRECT_URL=${DIRECT_URL}
    - PYTHON_API_URL=http://ai-service:8000
    - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - ai-service
    command: npm run dev